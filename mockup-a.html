<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Header Mockup A</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f6f7f2; padding: 20px; }
  .mockup { max-width: 900px; margin: 0 auto 40px; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; background: #fff; }
  .mockup-label { padding: 10px 16px; background: #1f2937; color: #fff; font-weight: 700; font-size: 0.9rem; }
  header { background: #1e3a8a; color: #f59e0b; padding: 24px 20px 28px; text-align: center; }
  header h1 { font-size: 1.6rem; font-weight: 900; letter-spacing: 0.05em; }
  nav { background: #1e3a8a; padding: 12px 18px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .nav-link { padding: 10px 18px; border-radius: 999px; text-decoration: none; color: #93c5fd; font-weight: 700; font-size: 0.92rem; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); transition: all 0.15s; }
  .nav-link.active { background: #f59e0b; color: #1e3a8a; border-color: #f59e0b; }
  .content { padding: 24px; }
  .card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="mockup">
    <div class="mockup-label">Mockup A — Dark blue header, orange active tab</div>
    <header><h1>PEMBINA VALLEY EVENTS</h1></header>
    <nav>
      <a href="#" class="nav-link active">Home</a>
      <a href="#" class="nav-link">Activities</a>
      <a href="#" class="nav-link">Sports</a>
      <a href="#" class="nav-link">Family</a>
      <a href="#" class="nav-link">Sources</a>
      <a href="#" class="nav-link">Contact</a>
    </nav>
    <div class="content">
      <div class="card"><strong>PVBC Vacation Bible School</strong><br>Ages 5-12 · Winkler MB</div>
      <div class="card"><strong>Kidventure Wednesdays</strong><br>1:00 PM · Altona EMM Church</div>
    </div>
  </div>
</body>
</html>
